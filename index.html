<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>UIU National Career Fest 2026 | Profile Frame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080a">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="page">

    <h1>UIU National Career Fest • 2026</h1>
    <p class="subtitle">Create Your Profile Frame</p>

    <label class="upload-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      <span>Upload Photo</span>
      <input type="file" id="upload" accept="image/*" hidden>
    </label>

    <div class="canvas-wrapper">
      <canvas id="canvas" width="420" height="420"></canvas>
    </div>

    <div class="controls">
      <span>Adjust Photo Zoom</span>
      <!-- Modern slider wrapper -->
      <div class="slider-container">
        <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
      </div>

      <!-- Modern HD / Ultra HD toggle -->
      <div class="quality modern-toggle">
        <label>
          <input type="radio" name="quality" value="1200" checked>
          <span>HD</span>
        </label>
        <label>
          <input type="radio" name="quality" value="2048">
          <span>Ultra HD</span>
        </label>
      </div>
    </div>

    <button id="download">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
      <span>Download Profile Picture</span>
    </button>

    <p class="footer">© <strong>DCCSA</strong>, United International University</p>
  </div>

  <script src="frame-data.js"></script>
  <script src="script.js"></script>
</body>

</html>
